name: Vowel Frequency Analyzer
description: Count vowels in a text file and append results to README.

inputs:
  file:
    description: Path to the text file to analyze.
    required: true
  github-user:
    description: GitHub username of the contributor.
    required: true

runs:
  using: docker
  image: ../../../Dockerfile
  env:
    FILE: ${{ inputs.file }}
    GITHUB_USER: ${{ inputs.github-user }}
